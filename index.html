<style>
/* Layout: a one-screen app. Gallery of pictures; tapping one opens a full-height canvas with the palette docked at the bottom. */
:root {
  --bg: #f1eef6;          /* lilac paper */
  --card: #ffffff;
  --ink: #2c2836;
  --muted: #7a7388;
  --line: #ddd6e8;
  --accent: #e2577e;      /* pin pink */
  --accent-ink: #ffffff;
  --cell-grid: rgba(60, 50, 80, .12);
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1922; --card: #26232f; --ink: #f1eef6; --muted: #a49cb4; --line: #3a3546; --accent: #f07a9a; --accent-ink: #1b1922; --cell-grid: rgba(255,255,255,.10); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1b1922; --card: #26232f; --ink: #f1eef6; --muted: #a49cb4; --line: #3a3546; --accent: #f07a9a; --accent-ink: #1b1922; --cell-grid: rgba(255,255,255,.10); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* gallery */
#gallery { height: 100%; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 22px; }
.brand { display: grid; gap: 4px; }
.brand h1 { margin: 0; font: 700 clamp(34px, 7vw, 48px)/1 var(--display); letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
.brand h1 i { width: .7em; height: .7em; background: var(--accent); display: inline-block; box-shadow: .18em .18em 0 var(--ink); }
.brand p { margin: 0; color: var(--muted); }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font: 700 15px/1 var(--display); min-height: 38px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab small { font: 700 12px/1 var(--body); opacity: .7; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 8px; text-align: left; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: var(--bg); border-radius: 8px; display: block; }
.card b { font: 700 18px/1.1 var(--display); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.done-tag { font: 700 12px/1 var(--display); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }

/* painting */
#paint { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); background: var(--bg); }
.top { display: flex; align-items: center; gap: 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.icon { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }
.icon svg { width: 20px; height: 20px; }
.ttl { flex: 1; min-width: 0; display: grid; gap: 3px; }
.ttl b { font: 700 18px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl .bar { height: 5px; }
.pct { font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.stage { position: relative; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.zoombtns { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: grid; gap: 6px; }
.dock { min-width: 0; background: var(--card); border-top: 2px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.pal { display: flex; gap: 10px; overflow-x: auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 4px 6px; scrollbar-width: none; }
.pal::-webkit-scrollbar { display: none; }
.sw { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--line); position: relative; display: grid; place-items: center; font: 700 17px/1 var(--display); transition: transform .12s; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); transform: translateY(-3px); }
.sw small { position: absolute; bottom: -2px; right: -4px; background: var(--card); color: var(--muted); font: 700 10px/1 var(--body); padding: 2px 4px; border-radius: 6px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.sw.full { opacity: .45; }
.sw.full::after { content: "✓"; position: absolute; font: 800 20px/1 var(--body); }
.hintrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: 4px; color: var(--muted); font-size: 13px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font: 700 13px/1 var(--body); display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
.chip.warn { border-color: var(--accent); color: var(--accent); }

/* finished */
#done { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; z-index: 5; }
.donebox { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; justify-items: center; max-width: 380px; width: 100%; text-align: center; }
.donebox h2 { margin: 0; font: 700 30px/1 var(--display); }
.donebox canvas, .donebox img { width: min(260px, 70vw); max-width: 100%; image-rendering: pixelated; border-radius: 10px; }
.donebox p { margin: 0; color: var(--muted); font-size: 14px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 18px; font: 700 16px/1 var(--body); min-height: 46px; }
@media (prefers-reduced-motion: reduce) { .sw { transition: none; } }
</style>

</head>
<body>
<section id="gallery" aria-labelledby="g-title">
  <div class="wrap">
    <div class="brand"><h1 id="g-title"><i aria-hidden="true"></i>Pontinho</h1><p>Escolha um desenho, toque numa cor e pinte os quadradinhos com aquele número.</p></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Categorias"></div>
    <div class="grid" id="cards" role="tabpanel"></div>
  </div>
</section>

<section id="paint" hidden aria-label="Pintar">
  <div class="top">
    <button class="icon" id="back" type="button" aria-label="Voltar pra galeria"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="ttl"><b id="pname">Desenho</b><div class="bar"><i id="pbar" style="width:0%"></i></div></div>
    <span class="pct" id="ppct">0%</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Desenho pra pintar"></canvas>
    <div class="zoombtns">
      <button class="icon" id="zin" type="button" aria-label="Aproximar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button class="icon" id="zout" type="button" aria-label="Afastar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button class="icon" id="zfit" type="button" aria-label="Ver o desenho inteiro"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div class="dock">
    <div class="hintrow"><span id="tip">Pinça: zoom · dois dedos: mover</span><span style="display:flex;gap:6px"><button class="chip" id="hint" type="button">Onde falta?</button><button class="chip" id="reset" type="button">Recomeçar</button></span></div>
    <div class="pal" id="pal" role="toolbar" aria-label="Cores"></div>
  </div>
</section>

<section id="done" hidden aria-labelledby="d-title">
  <div class="donebox">
    <h2 id="d-title">Prontinho!</h2>
    <canvas id="replay" width="240" height="240" aria-hidden="true"></canvas>
    <img id="finalimg" alt="Seu desenho pintado" hidden>
    <p id="dtxt">Toque e segure a imagem pra salvar no celular.</p>
    <button class="primary" id="dclose" type="button">Voltar pra galeria</button>
  </div>
</section>

<script>

/* gallery, filtered by category */
const CAT_NOME = { todos: 'Todos', fofo: 'Fofo', bichinhos: 'Bichinhos', comidinhas: 'Comidinhas', flores: 'Flores', halloween: 'Halloween', natal: 'Natal', pascoa: 'Páscoa', paisagens: 'Paisagens', pessoas: 'Pessoas' };
let cat = 'todos';

function renderTabs() {
  const used = ['todos', ...Object.keys(CAT_NOME).filter((k) => k !== 'todos' && ARTS.some((a) => (a.cats || []).includes(k)))];
  if (!used.includes(cat)) cat = 'todos';
  $('tabs').innerHTML = used.map((k) => `<button class="tab" type="button" role="tab" data-cat="${k}" aria-selected="${k === cat}">${CAT_NOME[k]}<small>${k === 'todos' ? ARTS.length : ARTS.filter((a) => (a.cats || []).includes(k)).length}</small></button>`).join('');

$('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b) return; cat = b.dataset.cat; try { localStorage.setItem('pontinho-cat', cat); } catch (err) { /* only a convenience */ } renderGallery(); });

  if (s >= 10) { ctx.strokeStyle = gridC; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = x0; x <= x1; x++) { const px = Math.round(view.x + x * s) + .5; ctx.moveTo(px, view.y + y0 * s); ctx.lineTo(px, view.y + y1 * s); }
    for (let y = y0; y <= y1; y++) { const py = Math.round(view.y + y * s) + .5; ctx.moveTo(view.x + x0 * s, py); ctx.lineTo(view.x + x1 * s, py); }
    ctx.stroke(); }
  if (pulse) { const k = (performance.now() - pulse.t0) / 1200; if (k > 1) pulse = null; else { ctx.strokeStyle = ink; ctx.lineWidth = 3; ctx.globalAlpha = 1 - k;
    ctx.beginPath(); ctx.arc(view.x + (pulse.x + .5) * s, view.y + (pulse.y + .5) * s, s * (.7 + k * 1.6), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; dirty = true; } }
}
function loop() { if (!$('paint').hidden && dirty) { dirty = false; draw(); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);

function renderPalette() {
  const pal = $('pal'); pal.innerHTML = '';
  art.colors.forEach((c, i) => {
    let ok = 0; for (let k = 0; k < st.cells.length; k++) if (art.target[k] === i && st.cells[k] === i) ok++;
    const left = art.count[i] - ok, b = document.createElement('button');
    b.type = 'button'; b.className = 'sw' + (left === 0 ? ' full' : ''); b.style.background = c; b.style.color = lum(c) > .6 ? '#2c2836' : '#ffffff';
    b.setAttribute('aria-pressed', i === sel); b.setAttribute('aria-label', `Cor ${i + 1}${left ? `, faltam ${left}` : ', completa'}`);
    b.innerHTML = `${left === 0 ? '' : i + 1}${left ? `<small>${left}</small>` : ''}`;
    b.addEventListener('click', () => { sel = i; renderPalette(); dirty = true; });
    pal.append(b);
  });
  const pr = progress(art, st); $('pbar').style.width = pr * 100 + '%'; $('ppct').textContent = Math.round(pr * 100) + '%';
}
function nextColour() { for (let k = 1; k <= art.colors.length; k++) { const i = (sel + k) % art.colors.length; for (let c = 0; c < st.cells.length; c++) if (art.target[c] === i && st.cells[c] !== i) return i; } return sel; }

let saveTimer = 0;
function paintCell(x, y, onlyMatching) {
  if (x < 0 || y < 0 || x >= art.w || y >= art.h) return false;
  const i = y * art.w + x;
  if (st.cells[i] === art.target[i]) return false;
  if (onlyMatching && art.target[i] !== sel) return false;
  st.cells[i] = sel; if (sel === art.target[i]) st.order.push(i);
  dirty = true; return i;
}
function afterPaint() {
  clearTimeout(saveTimer); saveTimer = setTimeout(() => store(art, st), 400);
  let left = 0; for (let k = 0; k < st.cells.length; k++) if (art.target[k] === sel && st.cells[k] !== sel) left++;
  if (left === 0) { const n = nextColour(); if (n !== sel) sel = n; }
  renderPalette();
  if (progress(art, st) >= 1) { store(art, st); setTimeout(finish, 350); }
}

/* touch: one finger paints, two fingers pinch and move; a quick second finger cancels the first dab */
const pts = new Map(); let mode = null, stroke = [], gesture = null, last = null;
const cellAt = (cx, cy) => { const r = stage.getBoundingClientRect(); return [Math.floor((cx - r.left - view.x) / view.s), Math.floor((cy - r.top - view.y) / view.s)]; };
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { mode = 'paint'; stroke = []; const [x, y] = cellAt(e.clientX, e.clientY); last = [x, y]; const i = paintCell(x, y, false); if (i !== false) stroke.push([i, -1]); stroke.t0 = performance.now(); }
  else if (pts.size === 2) {
    if (mode === 'paint' && stroke.length <= 2 && performance.now() - stroke.t0 < 250) stroke.forEach(([i, prev]) => { st.cells[i] = prev; if (st.order[st.order.length - 1] === i) st.order.pop(); });
    else if (stroke.length) afterPaint();
    mode = 'gesture'; const [a, b] = [...pts.values()]; gesture = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; dirty = true;
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'paint' && pts.size === 1) {
    const [x, y] = cellAt(e.clientX, e.clientY); if (last && x === last[0] && y === last[1]) return;
    // step through every cell between the last one and this one so fast strokes leave no gaps
    const [lx, ly] = last || [x, y], n = Math.max(Math.abs(x - lx), Math.abs(y - ly));
    for (let k = 1; k <= n; k++) { const cx = Math.round(lx + (x - lx) * k / n), cy = Math.round(ly + (y - ly) * k / n), i = paintCell(cx, cy, true); if (i !== false) stroke.push([i, -1]); }
    last = [x, y];
  } else if (mode === 'gesture' && pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, r = stage.getBoundingClientRect();
    view.x += mx - gesture.mx; view.y += my - gesture.my; zoomAt(d / gesture.d, mx - r.left, my - r.top);
    gesture = { d, mx, my };
  }
});
const up = (e) => { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if (pts.size === 0) { if (mode === 'paint' && stroke.length) afterPaint(); mode = null; stroke = []; last = null; } };
['pointerup', 'pointercancel'].forEach((k) => cv.addEventListener(k, up));
cv.addEventListener('wheel', (e) => { e.preventDefault(); const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top); else { view.x -= e.deltaX; view.y -= e.deltaY; clampView(); dirty = true; } }, { passive: false });
$('zin').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(1.4, r.width / 2, r.height / 2); });
$('zout').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(1 / 1.4, r.width / 2, r.height / 2); });
$('zfit').addEventListener('click', fit);
$('hint').addEventListener('click', () => {
  const r = stage.getBoundingClientRect(), cx = (r.width / 2 - view.x) / view.s, cy = (r.height / 2 - view.y) / view.s; let best = -1, bd = 1e9;
  for (let i = 0; i < st.cells.length; i++) if (art.target[i] === sel && st.cells[i] !== sel) { const d = (i % art.w - cx) ** 2 + ((i / art.w | 0) - cy) ** 2; if (d < bd) { bd = d; best = i; } }
  if (best < 0) return;
  const x = best % art.w, y = best / art.w | 0; view.s = Math.max(view.s, 28); view.x = r.width / 2 - (x + .5) * view.s; view.y = r.height / 2 - (y + .5) * view.s; clampView();
  pulse = { x, y, t0: performance.now() }; dirty = true;
});
let resetArmed = 0;
$('reset').addEventListener('click', (e) => {
  const b = e.currentTarget;
  if (Date.now() - resetArmed > 3000) { resetArmed = Date.now(); b.textContent = 'Apagar tudo?'; b.classList.add('warn'); setTimeout(() => { b.textContent = 'Recomeçar'; b.classList.remove('warn'); }, 3000); return; }
  resetArmed = 0; st = { cells: new Int8Array(art.w * art.h).fill(-1), order: [] }; store(art, st); sel = 0; renderPalette(); dirty = true; b.textContent = 'Recomeçar'; b.classList.remove('warn');
});
addEventListener('resize', () => { if (!$('paint').hidden) { resize(); clampView(); } });

function open(a) {
  art = a; st = stateOf(a); sel = 0;
  for (let i = 0; i < a.colors.length; i++) { let left = false; for (let c = 0; c < st.cells.length; c++) if (a.target[c] === i && st.cells[c] !== i) { left = true; break; } if (left) { sel = i; break; } }
  $('gallery').hidden = true; $('paint').hidden = false; $('pname').textContent = a.nome;
  resize(); fit(); renderPalette();
}
$('back').addEventListener('click', () => { if (art && st) store(art, st); $('paint').hidden = true; $('gallery').hidden = false; renderGallery(); });

/* the finished picture replays in the order it was painted */
function finish() {
  $('done').hidden = false;
  const c = $('replay'), g = c.getContext('2d'), s = Math.floor(240 / Math.max(art.w, art.h)), ox = (240 - art.w * s) / 2, oy = (240 - art.h * s) / 2;
  g.imageSmoothingEnabled = false; g.clearRect(0, 0, 240, 240);
  const order = st.order.length === art.target.length ? st.order : [...Array(art.target.length).keys()];
  const fill = (i) => { g.fillStyle = art.colors[art.target[i]]; g.fillRect(ox + (i % art.w) * s, oy + (i / art.w | 0) * s, s, s); };
  const big = document.createElement('canvas'); big.width = art.w * 16; big.height = art.h * 16; const bg2 = big.getContext('2d');
  art.target.forEach((t, i) => { bg2.fillStyle = art.colors[t]; bg2.fillRect((i % art.w) * 16, (i / art.w | 0) * 16, 16, 16); });
  const showImg = () => { const im = $('finalimg'); im.src = big.toDataURL('image/png'); im.hidden = false; c.hidden = true; };
  c.hidden = false; $('finalimg').hidden = true;
  if (reduce) { order.forEach(fill); showImg(); return; }
  let k = 0; const per = Math.max(1, Math.ceil(order.length / 90));
  (function step() { for (let n = 0; n < per && k < order.length; n++) fill(order[k++]); if (k < order.length) requestAnimationFrame(step); else setTimeout(showImg, 500); })();
}
$('dclose').addEventListener('click', () => { $('done').hidden = true; $('paint').hidden = true; $('gallery').hidden = false; renderGallery(); });

renderGallery();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {}));
}
</script>
