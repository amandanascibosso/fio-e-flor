<style>
/* Layout: a one-screen app. Gallery of pictures; tapping one opens a full-height canvas with the palette docked at the bottom. */
:root {
  --bg: #faf9fc;          /* almost white */
  --card: #ffffff;
  --ink: #2c2836;
  --muted: #7a7388;
  --line: #ddd6e8;
  --accent: #e2577e;      /* pin pink */
  --accent-ink: #ffffff;
  --cell-grid: rgba(60, 50, 80, .12);
  --board: #fbfafd;      /* the pegboard */
  --peg: rgba(60, 50, 80, .16);
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1922; --card: #26232f; --ink: #f1eef6; --muted: #a49cb4; --line: #3a3546; --accent: #f07a9a; --accent-ink: #1b1922; --cell-grid: rgba(255,255,255,.10); --board: #332e3e; --peg: rgba(255,255,255,.14); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1b1922; --card: #26232f; --ink: #f1eef6; --muted: #a49cb4; --line: #3a3546; --accent: #f07a9a; --accent-ink: #1b1922; --cell-grid: rgba(255,255,255,.10); --board: #332e3e; --peg: rgba(255,255,255,.14); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* gallery */
#gallery { height: 100%; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 22px; }
.brand { display: grid; gap: 4px; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
.brand p { grid-column: 1 / -1; }
#theme .moon { display: none; }
:root[data-theme="dark"] #theme .sun { display: none; } :root[data-theme="dark"] #theme .moon { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #theme .sun { display: none; } :root:not([data-theme="light"]) #theme .moon { display: block; } }
.brand h1 { margin: 0; font: 700 clamp(34px, 7vw, 48px)/1 var(--display); letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
.brand h1 i { width: .7em; height: .7em; background: var(--accent); display: inline-block; box-shadow: .18em .18em 0 var(--ink); }
.brand p { margin: 0; color: var(--muted); }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font: 700 15px/1 var(--display); min-height: 38px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab small { font: 700 12px/1 var(--body); opacity: .7; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 8px; text-align: left; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card canvas { width: 100%; aspect-ratio: 1; background: var(--bg); border-radius: 8px; display: block; }
.card b { font: 700 18px/1.1 var(--display); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meta b.big { color: var(--accent); font: 700 12px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; }
.ver { margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
.done-tag { font: 700 12px/1 var(--display); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }

/* painting */
#paint { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); background: var(--bg); }
.top { display: flex; align-items: center; gap: 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.icon { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }
.icon svg { width: 20px; height: 20px; }
.ttl { flex: 1; min-width: 0; display: grid; gap: 3px; }
.ttl b { font: 700 18px/1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl .bar { height: 5px; }
.pct { font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.stage { position: relative; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.zoombtns { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: grid; gap: 6px; }
.dock { min-width: 0; background: var(--card); border-top: 2px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.pal { display: flex; gap: 10px; overflow-x: auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 4px 6px; scrollbar-width: none; }
.pal::-webkit-scrollbar { display: none; }
.sw { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--line); position: relative; display: grid; place-items: center; font: 700 17px/1 var(--display); transition: transform .12s; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); transform: translateY(-3px); }
.sw small { position: absolute; bottom: -2px; right: -4px; background: var(--card); color: var(--muted); font: 700 10px/1 var(--body); padding: 2px 4px; border-radius: 6px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.sw.full { opacity: .45; }
.sw.full::after { content: "✓"; position: absolute; font: 800 20px/1 var(--body); }
.hintrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: 4px; color: var(--muted); font-size: 13px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font: 700 13px/1 var(--body); display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
.chip.warn { border-color: var(--accent); color: var(--accent); }

/* loading: a random picture fills itself with beads while fonts and the gallery get ready */
#splash { position: fixed; inset: 0; z-index: 9; background: var(--bg); display: grid; place-items: center; transition: opacity .4s; }
#splash.out { opacity: 0; pointer-events: none; }
.splashbox { display: grid; justify-items: center; gap: 18px; padding: 24px; }
.splashbox canvas { width: min(240px, 60vw); aspect-ratio: 1; border-radius: 14px; }
.splashbox h1 { margin: 0; font: 700 44px/1 var(--display); display: flex; align-items: center; gap: 10px; }
.splashbox h1 i { width: .7em; height: .7em; background: var(--accent); display: inline-block; box-shadow: .18em .18em 0 var(--ink); }
.splashbox p { margin: 0; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { #splash { transition: none; } }

/* size picker and the stamps earned per size */
#pick { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; z-index: 5; }
.pickbox h2 { font-size: 24px; }
.opts { display: grid; gap: 8px; width: 100%; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 56px; }
.opt:hover { border-color: var(--accent); }
.opt > span { flex: 1; min-width: 0; display: grid; gap: 3px; }
.opt b { font: 700 17px/1 var(--display); }
.opt small { color: var(--muted); font-size: 12px; }
.opt .bar { display: block; height: 4px; }
.opt em { font: 700 13px/1 var(--display); font-style: normal; color: var(--muted); }
.stamps { display: inline-flex; gap: 5px; }
.stamp { width: 18px; height: 18px; border-radius: 50%; border: 2px dashed var(--line); display: inline-grid; place-items: center; flex: none; box-sizing: border-box; }
.stamp.on { border: 2px solid var(--accent); background: var(--accent); }
.stamp.on::after { content: ""; width: 5px; height: 9px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.opt .stamp { width: 24px; height: 24px; }
.opt .stamp.on::after { width: 6px; height: 11px; }

/* finished */
#done { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; z-index: 5; }
.donebox { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; justify-items: center; max-width: 380px; width: 100%; text-align: center; }
.donebox h2 { margin: 0; font: 700 30px/1 var(--display); }
.donebox canvas, .donebox img { width: min(300px, 76vw); max-width: 100%; border-radius: 10px; }
.donebox .chip { min-height: 40px; }
.donebox p { margin: 0; color: var(--muted); font-size: 14px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 18px; font: 700 16px/1 var(--body); min-height: 46px; }
@media (prefers-reduced-motion: reduce) { .sw { transition: none; } }
</style>

</head>

<section id="splash" aria-label="Carregando"><div class="splashbox"><canvas id="splashcv" width="480" height="480" aria-hidden="true"></canvas><h1><i aria-hidden="true"></i>Pontinho</h1><p id="splashtxt">montando as continhas…</p></div></section>

<section id="gallery" aria-labelledby="g-title">
  <div class="wrap">
    <div class="brand"><h1 id="g-title"><i aria-hidden="true"></i>Pontinho</h1><button class="icon" id="theme" type="button" aria-label="Trocar entre modo claro e escuro"><svg class="sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 1.5v2.5M10 16v2.5M1.5 10H4M16 10h2.5M4 4l1.8 1.8M14.2 14.2 16 16M4 16l1.8-1.8M14.2 5.8 16 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><svg class="moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></button><p>Escolha um desenho, toque numa cor e encaixe as continhas com aquele número. No fim, passe o ferrinho.</p></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Categorias"></div>
    <div class="grid" id="cards" role="tabpanel"></div>
    <p class="ver">Pontinho · versão 15</p>
  </div>
</section>

<section id="paint" hidden aria-label="Pintar">
  <div class="top">
    <button class="icon" id="back" type="button" aria-label="Voltar pra galeria"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="ttl"><b id="pname">Desenho</b><div class="bar"><i id="pbar" style="width:0%"></i></div></div>
    <span class="pct" id="ppct">0%</span>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Desenho pra pintar"></canvas>
    <div class="zoombtns">
      <button class="icon" id="zin" type="button" aria-label="Aproximar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button class="icon" id="zout" type="button" aria-label="Afastar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button class="icon" id="zfit" type="button" aria-label="Ver o desenho inteiro"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div class="dock">
    <div class="hintrow"><span id="tip">Pinça: zoom · dois dedos: mover</span><span style="display:flex;gap:6px"><button class="chip" id="hint" type="button">Onde falta?</button></span></div>
    <div class="pal" id="pal" role="toolbar" aria-label="Cores"></div>
  </div>
</section>

<section id="pick" hidden aria-labelledby="pickname">
  <div class="donebox pickbox">
    <h2 id="pickname">Desenho</h2>
    <p>Que tamanho você quer montar?</p>
    <div class="opts" id="pickopts"></div>
    <button class="chip" id="pickclose" type="button">Voltar</button>
  </div>
</section>

<section id="done" hidden aria-labelledby="d-title">
  <div class="donebox">
    <h2 id="d-title">Prontinho!</h2>
    <canvas id="replay" width="480" height="480" aria-hidden="true"></canvas>
    <img id="finalimg" alt="Seu desenho passado a ferro" hidden>
    <p id="dtxt">Todas as continhas no lugar.</p>
    <button class="primary" id="iron" type="button" hidden>Passar o ferrinho</button>
    <button class="chip" id="dclose" type="button">Voltar pra galeria</button>
  </div>
</section>

function open(a) {

const D = 480;

function ironIt() {

/* splash: one picture at random fills itself up, then the gallery takes over */
(function splash() {
  const box = $('splash'), a = ARTS[Math.floor(Math.random() * ARTS.length)], c = $('splashcv'), g = c.getContext('2d');
  const s = Math.floor(D / (Math.max(a.w, a.h) + 2)), ox = (D - a.w * s) / 2, oy = (D - a.h * s) / 2, cols = boardColours();

})();
